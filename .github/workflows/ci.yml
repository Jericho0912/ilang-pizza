name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
        pandas: ["latest"]
        include:
          # Google Colab still ships pandas 2.2, and the Colab notebook installs on top of it.
          - python-version: "3.12"
            pandas: "2.2"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # CPU-only wheels first, so tabpfn's torch requirement doesn't pull CUDA.
      - name: Install CPU-only PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install ilang-pizza with dev tools
        run: python -m pip install -e ".[dev]"

      - name: Pin pandas ${{ matrix.pandas }}
        if: matrix.pandas != 'latest'
        run: python -m pip install "pandas==${{ matrix.pandas }}.*"

      - name: Lint
        run: ruff check .

      # Tests marked tabpfn, network or ollama are skipped unless ILANG_PIZZA_TEST_<MARKER>=1.
      - name: Test
        run: pytest
