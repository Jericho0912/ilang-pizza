[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ilang-pizza"
version = "0.1.0"
description = "Ilang pizza? Predict how many people will actually show up to a free community meetup, with TabPFN and a local Gemma."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "wysiwyg (Jericho0912)" }]
keywords = ["tabpfn", "gemma", "ollama", "meetup", "community", "python-philippines", "hacktoberfest"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "tabpfn>=9.2",
  "pandas>=2.2",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "gradio>=5",
  "ollama>=0.4",
  "typer>=0.12",
  "holidays>=0.60",
  "requests>=2.31",
  "httpx>=0.27",
  "openpyxl>=3.1",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.17,<0.18"]

[project.scripts]
ilang-pizza = "ilang_pizza.cli:app"

[project.urls]
Repository = "https://github.com/Jericho0912/ilang-pizza"

[tool.hatch.build.targets.wheel]
packages = ["src/ilang_pizza"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "tabpfn: needs TabPFN weights (downloads on first use); run with ILANG_PIZZA_TEST_TABPFN=1",
  "network: needs internet (Open-Meteo); run with ILANG_PIZZA_TEST_NETWORK=1",
  "ollama: needs a running Ollama server with the configured model; run with ILANG_PIZZA_TEST_OLLAMA=1",
]

[tool.ruff]
line-length = 100
target-version = "py311"
